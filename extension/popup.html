<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Fırsat Radarı</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup">
  <header class="bar">
    <div class="brand">
      <img src="icons/icon32.png" alt="" width="20" height="20">
      <span>Fırsat Radarı</span>
    </div>
    <div class="actions">
      <button id="refresh" class="icon-btn" title="Şimdi tara" aria-label="Şimdi tara">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
      </button>
      <button id="settings" class="icon-btn" title="Ayarlar" aria-label="Ayarlar">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </div>
  </header>

  <div class="toolbar">
    <input id="q" type="search" placeholder="Başlıkta ara… (ör. monitör, ssd)" autocomplete="off">
    <select id="sort" aria-label="Sıralama">
      <option value="new">En yeni</option>
      <option value="hot">En çok yorum</option>
      <option value="cheap">En ucuz</option>
    </select>
  </div>

  <nav id="chips" class="chips" aria-label="Kaynak filtresi"></nav>
  <div id="errors" class="errors" hidden></div>

  <main>
    <ul id="list" class="list"></ul>
    <div id="empty" class="empty" hidden></div>
  </main>

  <footer class="foot">
    <span id="lastRun"></span>
    <span id="counts"></span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
